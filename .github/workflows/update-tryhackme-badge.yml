name: Update TryHackMe Badge

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Playwright
      run: |
        npm install playwright
        npx playwright install chromium

    - name: Generate TryHackMe Badge Image
      run: |
        # Create badges directory if it doesn't exist
        mkdir -p assets/badges

        # Create a script to capture the badge using Playwright
        cat > capture-badge.js << 'EOF'
        const { chromium } = require('playwright');

        async function captureBadge() {
          const browser = await chromium.launch();
          const page = await browser.newPage();

          try {
            // Navigate to TryHackMe profile
            await page.goto('https://tryhackme.com/p/2277462', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });

            // Wait for content to load
            await page.waitForTimeout(3000);

            // Try to find badge elements - look for common selectors
            const badgeSelectors = [
              '.badge',
              '[class*="badge"]',
              '.achievement',
              '[class*="achievement"]',
              'img[alt*="TryHackMe"]',
              'img[alt*="badge"]'
            ];

            let badgeFound = false;
            for (const selector of badgeSelectors) {
              try {
                const element = await page.$(selector);
                if (element) {
                  await element.screenshot({ path: 'assets/badges/tryhackme-badge.png' });
                  console.log(`Badge captured using selector: ${selector}`);
                  badgeFound = true;
                  break;
                }
              } catch (e) {
                continue;
              }
            }

            if (!badgeFound) {
              // Fallback: capture a screenshot of the profile area that might contain badges
              await page.screenshot({
                path: 'assets/badges/tryhackme-badge.png',
                clip: { x: 0, y: 100, width: 500, height: 150 }
              });
              console.log('Fallback screenshot taken');
            }

          } catch (error) {
            console.error('Error capturing badge:', error);

            // Final fallback: download existing badge
            const https = require('https');
            const fs = require('fs');

            return new Promise((resolve, reject) => {
              const file = fs.createWriteStream('assets/badges/tryhackme-badge.png');
              https.get('https://tryhackme-badges.s3.amazonaws.com/gr4ndf4th3r.png', (response) => {
                response.pipe(file);
                file.on('finish', () => {
                  file.close();
                  console.log('Fallback badge downloaded from S3');
                  resolve();
                });
              }).on('error', (err) => {
                fs.unlink('assets/badges/tryhackme-badge.png', () => {});
                reject(err);
              });
            });

          } finally {
            await browser.close();
          }
        }

        captureBadge().catch(console.error);
        EOF

    - name: Run badge capture script
      run: |
        node capture-badge.js

        # Verify the file was created
        if [ -f "assets/badges/tryhackme-badge.png" ]; then
          echo "Badge file created successfully"
          ls -la assets/badges/
        else
          echo "Badge file was not created"
          exit 1
        fi

    - name: Update README with cache busting
      run: |
        # Get current date for cache busting
        DATE=$(date +%Y%m%d_%H%M%S)

        # Update the README.md to include cache busting parameter
        sed -i "s|assets/badges/tryhackme-badge.png?v=[0-9_]*|assets/badges/tryhackme-badge.png?v=$DATE|g" README.md

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Check if there are changes to commit
        if git diff --quiet && git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git add assets/badges/tryhackme-badge.png README.md
          git commit -m "Update TryHackMe badge [automated]"
          git push
        fi